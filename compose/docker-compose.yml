services:
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: logistream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: logistream-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: logistream
      MINIO_ROOT_PASSWORD: logistream123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: logistream-postgres
    environment:
      POSTGRES_USER: logistream
      POSTGRES_PASSWORD: logistream
      POSTGRES_DB: logistream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistream -d logistream"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
  postgres_data:
